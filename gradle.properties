org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official

# Published coordinates. GROUP + VERSION_NAME are the single source of truth: the root
# build script reads them, and the Gradle plugin bakes them into the artifact coordinates
# it resolves at apply time. Bump VERSION_NAME before tagging a release.
GROUP=com.adkhambek.ktor.kit
VERSION_NAME=0.1.0

POM_URL=https://github.com/MrAdkhambek/KtorKIT
POM_INCEPTION_YEAR=2026
POM_SCM_URL=https://github.com/MrAdkhambek/KtorKIT
POM_SCM_CONNECTION=scm:git:git://github.com/MrAdkhambek/KtorKIT.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/MrAdkhambek/KtorKIT.git
POM_LICENCE_NAME=MIT License
POM_LICENCE_URL=https://opensource.org/licenses/MIT
POM_LICENCE_DIST=repo

POM_DEVELOPER_ID=MrAdkhambek
POM_DEVELOPER_NAME=MrAdkhambek
POM_DEVELOPER_URL=https://github.com/MrAdkhambek
