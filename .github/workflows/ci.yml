name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS so the Apple targets and the macosArm64 test suite are actually exercised;
    # a Linux runner would silently skip them.
    runs-on: macos-latest

    env:
      # Publishing signs unconditionally, and the integration consumers below need
      # artifacts in the local repository, so CI needs the signing key too. No Maven
      # Central credentials here — this job never uploads anything.
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test (JVM, JS, native)
        run: ./gradlew build

      # The suites above wire the compiler plugin with -Xplugin= directly, so they never
      # exercise the Gradle plugin — the one path every real consumer takes. These builds
      # apply the published plugin for real, on both project shapes.
      - name: Publish to Maven local for the integration consumers
        run: ./gradlew publishToMavenLocal

      - name: Integration test — JVM consumer
        working-directory: integration-tests/jvm-consumer
        run: ../../gradlew build

      - name: Integration test — Kotlin Multiplatform consumer
        working-directory: integration-tests/kmp-consumer
        run: ../../gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7
