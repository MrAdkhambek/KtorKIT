name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    # macOS, not ubuntu: the runtime publishes Apple targets (iOS/macOS/watchOS/tvOS),
    # whose klibs can only be produced on a Mac host. A macOS runner also cross-compiles
    # the linuxX64 and mingwX64 targets, so one job publishes all 14.
    runs-on: macos-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Publishing an unverified build would be worse than not publishing at all.
      - name: Verify
        run: ./gradlew build

      - name: Publish runtime, compiler and Gradle plugin
        run: ./gradlew publishToMavenCentral --no-configuration-cache
